specVersion: 0.0.5
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: GovToken
    network: sepolia
    source:
      address: "0x4A3D90a0CC9eC9FAde8c61604fE38dd79C832d3a"
      abi: GovToken
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TokenHolder
        - Delegate
      abis:
        - name: GovToken
          file: GovToken\GovToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: DelegateChanged(indexed address,indexed address,indexed address)
          handler: handleDelegateChanged
        - event: DelegateVotesChanged(indexed address,uint256,uint256)
          handler: handleDelegateVotesChanged
      file: GovToken\GovToken.wasm
  - kind: ethereum
    name: MyGovernor
    network: sepolia
    source:
      address: "0x5904e6016f06dEE649883C8F89C77367dEfb3225"
      abi: MyGovernor
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Proposal
        - Vote
      abis:
        - name: MyGovernor
          file: MyGovernor\MyGovernor.json
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
        - event: VoteCastWithParams(indexed address,uint256,uint8,uint256,string,bytes)
          handler: handleVoteCastWithParams
      file: MyGovernor\MyGovernor.wasm
  - kind: ethereum
    name: TimeLock
    network: sepolia
    source:
      address: "0x026B0DA2b7990E6eaC1dd06ff5A30E38A8C69BBb"
      abi: TimeLock
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TimelockCall
      abis:
        - name: TimeLock
          file: TimeLock\TimeLock.json
      eventHandlers:
        - event: CallScheduled(indexed bytes32,indexed
            uint256,address,uint256,bytes,bytes32,uint256)
          handler: handleCallScheduled
        - event: CallExecuted(indexed bytes32,indexed uint256,address,uint256,bytes)
          handler: handleCallExecuted
        - event: Cancelled(indexed bytes32)
          handler: handleCancelled
      file: TimeLock\TimeLock.wasm
  - kind: ethereum
    name: LendingPool
    network: sepolia
    source:
      address: "0x6c42543705B3D3A71E9FB3ed49dD90651DCDcb06"
      abi: LendingPool
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - LendingUser
      abis:
        - name: LendingPool
          file: LendingPool\LendingPool.json
      callHandlers:
        - function: deposit(uint256)
          handler: handleDepositCall
        - function: borrow(uint256)
          handler: handleBorrowCall
        - function: repay(uint256)
          handler: handleRepayCall
        - function: liquidate(address,uint256)
          handler: handleLiquidateCall
      file: LendingPool\LendingPool.wasm
  - kind: ethereum
    name: SimpleVault
    network: sepolia
    source:
      address: "0xE820Eba717F5f814B5e7De9BCd9Db8C49824d00e"
      abi: SimpleVault
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
        - VaultUser
      abis:
        - name: SimpleVault
          file: SimpleVault\SimpleVault.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleVaultDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleVaultWithdraw
      file: SimpleVault\SimpleVault.wasm
  - kind: ethereum
    name: AMMPair
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000006"
      abi: AMMPair
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - AMMPool
        - AMMPosition
      abis:
        - name: AMMPair
          file: AMMPair\AMMPair.json
      callHandlers:
        - function: addLiquidity(uint256,uint256)
          handler: handleAddLiquidityCall
        - function: swap0To1(uint256)
          handler: handleSwap0To1Call
        - function: swap1To0(uint256)
          handler: handleSwap1To0Call
      file: AMMPair\AMMPair.wasm
  - kind: ethereum
    name: PriceOracle
    network: sepolia
    source:
      address: "0xaB67c7965230E1b18907275565A160F32a32d474"
      abi: PriceOracle
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - OracleConfiguration
        - PriceRecord
      abis:
        - name: PriceOracle
          file: PriceOracle\PriceOracle.json
      blockHandlers:
        - handler: handleBlock
      file: PriceOracle\PriceOracle.wasm
