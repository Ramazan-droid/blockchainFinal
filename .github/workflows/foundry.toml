[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.35"

# Optional: define a ci profile to remove the warning
[profile.ci]
# inherits from default if not overridden

# List your dependencies explicitly
[dependencies]
forge-std = { version = "1", url = "https://github.com/foundry-rs/forge-std" }
openzeppelin-contracts = { version = "5", url = "https://github.com/OpenZeppelin/openzeppelin-contracts" }
chainlink-brownie-contracts = { version = "1", url = "https://github.com/smartcontractkit/chainlink-brownie-contracts" }

# Remappings (auto-generated by forge install, but you can set manually)
remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "chainlink-brownie-contracts/=lib/chainlink-brownie-contracts/"
]